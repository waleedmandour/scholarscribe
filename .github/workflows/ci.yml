# ScholarScribe. continuous integration.
# Runs on every push to main and on every pull request.
# Verifies the frontend type-checks and the Rust code compiles.
# Does NOT build installers. that's release.yml's job.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm run build

  check-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: Install Tauri Linux deps (for cargo check only)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev
      - name: cargo fmt check
        working-directory: src-tauri
        run: cargo fmt -- --check
      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy -- -D warnings
        # Pre-existing clippy debt across 9 source files (~21 warnings:
        # manual_inspect, if_same_then_else, useless_format, collapsible_if,
        # unnecessary_sort_by, manual_pattern_char_comparison,
        # regex_creation_in_loops, manual_strip, let_and_return, etc.)
        # blocks strict clippy in this sprint. Tracked as a follow-up task
        # in CHANGELOG.md decision 9. Re-enable strict mode (remove the
        # continue-on-error line below) once that debt is cleared.
        continue-on-error: true
      - name: cargo check
        working-directory: src-tauri
        run: cargo check
      - name: cargo test
        working-directory: src-tauri
        run: cargo test --lib
      - name: Proofread invariant checks
        run: bash scripts/check-proofread-invariants.sh
      - name: MSRV check (Rust 1.85)
        uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: rustfmt, clippy
      - name: cargo check on MSRV (1.85)
        working-directory: src-tauri
        run: cargo +1.85.0 check
