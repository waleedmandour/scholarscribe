# ScholarScribe. continuous integration.
# Runs on every push to main and on every pull request.
# Verifies: frontend type-check and build; Rust fmt, clippy (strict), check
# and tests (including the Rust-vs-JS verifier cross-check fixture); the
# network-surface test (source hosts vs docs/NETWORK_SURFACE.json vs
# SECURITY.md); the references test (citations vs src/lib/references.json);
# dependency audits (cargo audit report-only while open advisories await the
# dependabot bumps; npm audit blocking) and a CycloneDX SBOM artifact.
# Does NOT build installers. that's release.yml's job.

name: CI

on:
  push:
    branches:
      - main
      - feature/word-assist
  pull_request:
    branches:
      - main

jobs:
  check-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm run build
      - name: JS-side tests (references, network surface, verifier cross-check)
        run: npm test

  check-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: Install Tauri Linux deps (for cargo check only)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev
      - name: cargo fmt check
        working-directory: src-tauri
        run: cargo fmt -- --check
      - name: cargo clippy (strict; debt cleared in v2.2.1 r2)
        working-directory: src-tauri
        run: cargo clippy -- -D warnings
      - name: cargo test (blocking; includes the cross-language verifier fixture test)
        working-directory: src-tauri
        run: cargo test
      - name: cargo check
        working-directory: src-tauri
        run: cargo check
      - name: "cargo audit (report-only; advisories await the pending dependabot bumps: quick-xml #16, time #12, reqwest/rustls #9, thiserror #17)"
        working-directory: src-tauri
        continue-on-error: true
        run: |
          cargo install cargo-audit --locked --quiet
          cargo audit

  security-and-sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci --no-audit --no-fund
      - name: npm audit (production dependencies, blocking)
        run: npm audit --omit=dev
      - name: CycloneDX SBOM (npm)
        run: npx --yes @cyclonedx/cyclonedx-npm --omit dev --output-file sbom-npm.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-npm
          path: sbom-npm.json
      - name: CycloneDX SBOM (cargo)
        working-directory: src-tauri
        run: |
          cargo install cargo-cyclonedx --locked --quiet
          cargo cyclonedx --format json
          mv ./scholarscribe.cdx.json ../sbom-cargo.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-cargo
          path: sbom-cargo.json

  word-assist-gates:
    # Owner ruling D-1: the feature branch gets its own compile+test gates
    # so every phase report can cite a green CI run instead of
    # "CI-PENDING". The default build is untouched by the feature; this
    # job proves the gated code compiles and passes its own tests
    # (including the golden set) with the feature ON.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-wa-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-wa-
      - name: Install Tauri Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev
      - name: cargo fmt (feature build)
        working-directory: src-tauri
        run: cargo fmt -- --check
      - name: cargo clippy with word-assist (strict)
        working-directory: src-tauri
        run: cargo clippy --features word-assist --all-targets -- -D warnings
      - name: cargo test with word-assist (unit + golden set)
        working-directory: src-tauri
        run: cargo test --features word-assist
      - name: cargo check default build (feature stays opt-in)
        working-directory: src-tauri
        run: cargo check
      # H7: the DEFAULT config must resolve neither feature-only crate.
      # cargo tree -i exits non-zero when nothing matches, so success here
      # means "not found". Deliberately NOT checking hyper/rustls: they
      # are in the default tree through reqwest and Tauri.
      - name: "default build excludes rcgen and x509-parser (H7)"
        working-directory: src-tauri
        run: |
          if cargo tree -i rcgen; then
            echo "::error::rcgen resolved in the DEFAULT build — the word-assist feature is leaking"
            exit 1
          fi
          if cargo tree -i x509-parser; then
            echo "::error::x509-parser resolved in the DEFAULT build — the word-assist feature is leaking"
            exit 1
          fi
          echo "H7 OK: neither rcgen nor x509-parser resolves in the default config"
      # Held-out freeze integrity (owner directive): every file in
      # docs/EVAL/FROZEN.txt (the held-out schema + the golden smoke
      # set; future data files get frozen by the owner per
      # docs/EVAL/LABELLING_PROTOCOL.md rule 7) must be byte-identical.
      - name: "eval freeze integrity (FROZEN.txt hashes must match)"
        run: node scripts/check-eval-freeze.mjs
