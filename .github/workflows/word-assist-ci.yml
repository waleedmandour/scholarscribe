# ScholarScribe. Word Assist cross-platform CI (v0.1 work order A1).
#
# Adds the Windows and macOS legs (both architectures: GitHub now hosts
# macos-15-intel x86_64 images alongside the arm64 macos-latest images;
# labels verified against docs.github.com on 2026-10-23) for the checks
# that define D1: cargo fmt, clippy -D warnings, tests, with and without
# the word-assist feature. The app's existing ci.yml keeps running
# unchanged; this workflow covers the platform matrix it cannot.
#
# Frontend gates (svelte-check, vite build, npm test) plus the add-in
# client tests and the dist-matches-source check run on the same four
# operating systems, because path-separator and line-ending bugs in the
# embedded assets are exactly what the new legs exist to catch.
#
# Only GitHub-owned actions and dtolnay/rust-toolchain are used
# (work-order constraint); dtolnay is not GitHub-owned, so it is pinned
# by commit SHA (master@2026-10-16).

name: Word Assist CI

on:
  push:
    branches:
      - main
      - feature/word-assist
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux: mirrors the existing ci.yml legs so the matrix is
          # comparable across platforms.
          - os: ubuntu-latest
            features: ""
          - os: ubuntu-latest
            features: "--features word-assist"
          # Windows x64: the primary Word Assist platform (owner QA host).
          - os: windows-latest
            features: ""
          - os: windows-latest
            features: "--features word-assist"
          # macOS Apple Silicon.
          - os: macos-latest
            features: ""
          - os: macos-latest
            features: "--features word-assist"
          # macOS Intel (hosted x86_64 image; macos-13 is retired).
          - os: macos-15-intel
            features: ""
          - os: macos-15-intel
            features: "--features word-assist"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable (pinned action)
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          components: clippy, rustfmt

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-wa-${{ matrix.features }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-cargo-wa-${{ matrix.features }}-

      - name: Install Tauri Linux deps (for cargo check/test linking)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev

      - name: cargo fmt check
        working-directory: src-tauri
        run: cargo fmt -- --check

      - name: cargo clippy (strict, ${{ matrix.features || 'default' }})
        working-directory: src-tauri
        run: cargo clippy ${{ matrix.features }} --all-targets -- -D warnings

      - name: cargo test (${{ matrix.features || 'default' }})
        working-directory: src-tauri
        run: cargo test ${{ matrix.features }}

      # H7 (integration: on every OS, via each default-config leg): the
      # DEFAULT build must resolve neither feature-only crate. cargo tree
      # -i exits non-zero when nothing matches, so success here means
      # "not found". Deliberately NOT checking hyper/rustls: they are in
      # the default tree through reqwest and Tauri.
      - name: "default build excludes rcgen and x509-parser (H7)"
        if: matrix.features == ''
        working-directory: src-tauri
        run: |
          if cargo tree -i rcgen; then
            echo "::error::rcgen resolved in the DEFAULT build — the word-assist feature is leaking"
            exit 1
          fi
          if cargo tree -i x509-parser; then
            echo "::error::x509-parser resolved in the DEFAULT build — the word-assist feature is leaking"
            exit 1
          fi
          echo "H7 OK on ${{ runner.os }}: neither rcgen nor x509-parser resolves in the default config"

      # Held-out freeze integrity on every leg (byte-identical frozen
      # files across OSes is exactly what .gitattributes must guarantee).
      - name: "eval freeze integrity (FROZEN.txt hashes must match)"
        run: node scripts/check-eval-freeze.mjs

      # The default build must stay feature-free even when the feature
      # config runs on the same runner: proves the opt-in gate holds on
      # every OS, not just Linux.
      - name: cargo check default build (feature stays opt-in)
        if: matrix.features != ''
        working-directory: src-tauri
        run: cargo check

  node:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm run build
      - name: JS-side tests (references, network surface, verifier cross-check, add-in client, dist integrity)
        run: npm test
