# ScholarScribe. automated release builds on Windows, macOS (Apple Silicon
# and Intel, two separate .dmg files), and Linux.
#
# When you push a tag matching v* (e.g. v2.2.0-pre), this workflow:
#   1. Spins up Windows, two macOS runners (Apple Silicon + Intel), and
#      Linux runners in parallel.
#   2. Installs Rust, Node, and platform-specific prerequisites.
#   3. Builds platform installers via `tauri build`.
#   4. Uploads all installers to the matching GitHub Release.
#
# Release flavor is derived from the tag shape: a plain vX.Y.Z tag (e.g.
# v2.2.1) publishes a STABLE release, any suffix (v2.2.1-r5, v2.3.0-pre)
# publishes a pre-release, as before.
#
# To trigger:
#   git tag v2.2.1
#   git push origin v2.2.1

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (must already exist)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows x64. Tauri's default produces both .msi and .exe (NSIS).
          - platform: windows-latest
            args: ""
          # macOS Apple Silicon (macos-latest is M1). Native build, no
          # --target arg needed.
          - platform: macos-latest
            args: ""
          # macOS Intel, cross-compiled on the Apple Silicon runner.
          # The macos-13 Intel runner queue has been unavailable for this
          # repo: the v2.2.1 release job sat in queue for 24h and was
          # auto-cancelled, so v2.2.1 shipped without Intel assets. Rust
          # cross-compiles cleanly to x86_64-apple-darwin on arm64 macOS,
          # and the dmg/app.tar.gz bundling on the host is arch-agnostic.
          # Produces a separate .dmg from the Apple Silicon build.
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
          # Linux x64. Tauri's default produces both .deb and .AppImage.
          - platform: ubuntu-22.04
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          # Include runner.arch and the matrix args in the key so the
          # native Apple Silicon build and the x86_64 cross-compile (both
          # on macos-latest, ARM64) do not share one target cache.
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ matrix.args }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ matrix.args }}-

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev

      - name: Add cross-compile Rust target (Intel leg only)
        if: contains(matrix.args, '--target x86_64-apple-darwin')
        run: rustup target add x86_64-apple-darwin

      - name: Install npm dependencies
        run: npm install --no-audit --no-fund

      - name: Verify frontend type-checks
        run: npm run check

      - name: Derive release flavor from the tag
        id: meta
        shell: bash
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          # A plain vX.Y.Z tag publishes a stable release; any semver
          # prerelease suffix (v2.2.1-r5, v2.3.0-pre, v2.3.0-rc1) keeps
          # the historical pre-release behavior.
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
            echo "release_name=$TAG" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            echo "release_name=$TAG (Pre-release)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: ${{ steps.meta.outputs.release_name }}
          releaseBody: |
            ScholarScribe ${{ inputs.tag || github.ref_name }}

            ## What changed in this release

            See [CHANGELOG.md](CHANGELOG.md) for the full entry for this tag.

            - The Language Check tab: offline spelling, grammar, and style checking with proposed corrections, powered by the embedded harper engine (Apache 2.0, pinned to an exact version). Paste or import text (.txt, .md, .tex, .docx), pick an English dialect (American, British, Canadian, Australian, Indian), review category-colored underlines, and apply or dismiss corrections with one click. Personal dictionary, per-rule settings, apply-all per category, and .txt export included. Your text is analyzed in memory on your machine and never leaves it; the network-surface test proves no new hosts.
            - Carried from the r3 and r4 pre-releases: deterministic docx-to-LaTeX conversion (Text Cleaner), paste-references-to-BibTeX (Citation Manager), and the Svelte 5 startup fix with its CI regression gate.
            - Sidebar polish: the About tab now sits at the top of the Get started group, before Models, and the User Guide PDF is a true 2-page document.
            - Release pipeline: a parity gate fails CI when the Rust crates and their npm counterparts drift in version; CHECKSUMS.txt refresh and minisign signing run in a dedicated final job that waits for all four build legs; a plain vX.Y.Z tag now publishes a stable release while any suffixed tag stays a pre-release.
            - Language Check is deterministic but not complete, and the app says so plainly: a rule based checker can miss errors and can flag correct academic wording, so ignore, dictionary, and rule toggles are one click away. English only in this release.

            ## Install

            1. Install [Ollama](https://ollama.com/download).
            2. Download the installer for your platform below.
            3. Open ScholarScribe, go to the Models tab, download a model.
            4. See [USER_GUIDE.md](USER_GUIDE.md) for the 2-page walkthrough. A polished PDF copy is attached below as `ScholarScribe-User-Guide.pdf`.

            ## Platforms

            - **Windows**: `.msi` and `.exe` installers (x64).
            - **macOS Apple Silicon**: `.dmg` and `.app.tar.gz` (aarch64).
            - **macOS Intel**: `.dmg` and `.app.tar.gz` (x86_64, cross-compiled on the Apple Silicon runner).
            - **Linux**: `.deb` and `.AppImage` (x64).

            ## Privacy

            Zero telemetry. ScholarScribe's own process contacts `127.0.0.1:11434` (your local Ollama) always, plus Google's OAuth/Drive endpoints only if you opt in to the Google Docs import in the Provenance tab. Model downloads are fetched by the Ollama daemon itself (from `registry.ollama.ai` or `hf.co`) at your request and carry no text. All inference runs locally via Ollama. Full host list: [docs/NETWORK_SURFACE.json](docs/NETWORK_SURFACE.json) and [SECURITY.md](SECURITY.md).

            ## Ethical use

            ScholarScribe does **not** include detection-evasion features. See [docs/ETHICS.md](docs/ETHICS.md).

            ## Verification

            This release was gated on: `npm ci`, `npm run check`, `npm run build`, `cargo fmt --check`, `cargo check`, `cargo test` (all Rust tests including the Rust-vs-JS verifier cross-check fixture), `cargo clippy -- -D warnings`, the network-surface test (source hosts vs `docs/NETWORK_SURFACE.json` vs SECURITY.md), the references test (citations vs `src/lib/references.json`), and `npm audit --omit=dev`. Full history in [CHANGELOG.md](CHANGELOG.md). The `CHECKSUMS.txt` asset contains SHA-256 digests for every binary artifact and the User Guide PDF; when the maintainer's signing secret is configured in CI, a detached minisign signature `CHECKSUMS.txt.minisig` is attached as well.
          releaseDraft: false
          prerelease: ${{ steps.meta.outputs.is_prerelease == 'true' }}
          args: ${{ matrix.args }}

      # Generate the User Guide PDF and upload it to the release. Only runs on
      # the Linux matrix entry to avoid four-way duplicate uploads (the PDF
      # is platform-agnostic). Depends on the release having been created by
      # the tauri-action step above.
      - name: Generate and upload User Guide PDF
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          python3 -m pip install --quiet --user reportlab pypdf
          python3 scripts/user_guide_pdf.py --input USER_GUIDE.md --output ScholarScribe-User-Guide.pdf
          # Upload via the GitHub REST API. The release ID is discovered by
          # looking up the tag.
          TAG="${{ inputs.tag || github.ref_name }}"
          RELEASE_ID=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/${TAG}" \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['id'])")
          # Delete any existing PDF asset first (idempotent re-runs).
          EXISTING=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases/${RELEASE_ID}/assets?name=ScholarScribe-User-Guide.pdf" \
            | python3 -c "import json,sys; data=json.load(sys.stdin); print(data[0]['id'] if data else '')")
          if [ -n "$EXISTING" ]; then
            curl -s -X DELETE -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/releases/assets/${EXISTING}"
          fi
          # Upload the freshly generated PDF.
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/pdf" \
            --data-binary @ScholarScribe-User-Guide.pdf \
            "https://uploads.github.com/repos/${{ github.repository }}/releases/${RELEASE_ID}/assets?name=ScholarScribe-User-Guide.pdf"
          # CHECKSUMS.txt is NOT refreshed here. The refresh used to run in this
          # leg and could finish before the Windows leg uploaded its installers,
          # producing an incomplete checksum file (observed on r4 and repaired
          # manually). It now runs in the dedicated checksums job below, which
          # waits for every build leg.

  # Final job: runs only after ALL build legs succeed, so every asset (all
  # platform installers plus the User Guide PDF) exists before CHECKSUMS.txt
  # is computed. This closes the r4 race where faster legs produced a
  # CHECKSUMS.txt missing the slower legs' assets.
  checksums:
    needs: build
    runs-on: ubuntu-22.04
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      TAG_OVERRIDE: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Refresh CHECKSUMS.txt from all published assets
        run: |
          python3 - <<'PYEOF'
          import hashlib, json, os, urllib.request, urllib.error, sys
          TOKEN = os.environ['GITHUB_TOKEN']
          REPO = os.environ['GITHUB_REPOSITORY']
          TAG = os.environ.get('TAG_OVERRIDE', '') or os.environ.get('GITHUB_REF_NAME', '')
          if not TAG:
              print('No tag found, skipping CHECKSUMS refresh', file=sys.stderr)
              sys.exit(0)
          def api(method, path, body=None, headers_extra=None):
              url = f"https://api.github.com/repos/{REPO}/{path}"
              data = json.dumps(body).encode() if body else None
              headers = {'Authorization': f'token {TOKEN}', 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'}
              if headers_extra:
                  headers.update(headers_extra)
              req = urllib.request.Request(url, method=method, data=data, headers=headers)
              try:
                  with urllib.request.urlopen(req) as r:
                      return json.loads(r.read()) if r.status != 204 else {}
              except urllib.error.HTTPError as e:
                  print(f'HTTP {e.code}: {e.read().decode()[:300]}', file=sys.stderr)
                  return {}
          release = api('GET', f'releases/tags/{TAG}')
          if not release:
              sys.exit(1)
          upload_url = release['upload_url'].split('{')[0]
          # Delete existing CHECKSUMS.txt
          for a in release.get('assets', []):
              if a['name'] == 'CHECKSUMS.txt':
                  api('DELETE', f'releases/assets/{a["id"]}')
                  break
          # Download all current assets and compute SHA-256
          lines = []
          for a in release.get('assets', []):
              req = urllib.request.Request(a['browser_download_url'], headers={'Authorization': f'token {TOKEN}'})
              with urllib.request.urlopen(req) as r:
                  data = r.read()
              h = hashlib.sha256(data).hexdigest()
              lines.append(f'{h}  {a["name"]}')
          # Upload fresh CHECKSUMS.txt
          body = '\n'.join(lines) + '\n'
          req = urllib.request.Request(upload_url + '?name=CHECKSUMS.txt', data=body.encode(), method='POST',
              headers={'Authorization': f'token {TOKEN}', 'Accept': 'application/vnd.github+json', 'Content-Type': 'text/plain'})
          try:
              with urllib.request.urlopen(req) as r:
                  print(f'CHECKSUMS.txt uploaded: HTTP {r.status}')
          except urllib.error.HTTPError as e:
              print(f'CHECKSUMS upload failed: {e.read().decode()[:300]}', file=sys.stderr)
          PYEOF

      # T1.7: sign CHECKSUMS.txt with minisign when the maintainer has
      # configured the MINISIGN_SECRET_KEY (and optionally MINISIGN_PASSWORD)
      # secrets. With no secret configured this step skips with a visible
      # notice instead of failing the release (N6: skip with a visible notice).
      - name: Install Rust (for minisign)
        uses: dtolnay/rust-toolchain@stable

      - name: Sign CHECKSUMS.txt (minisign, only if signing secrets exist)
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TAG_OVERRIDE: ${{ inputs.tag || github.ref_name }}
        run: |
          if [ -z "$MINISIGN_SECRET_KEY" ]; then
            echo "::notice::CHECKSUMS.txt signing skipped: the MINISIGN_SECRET_KEY secret is not configured. Add it (plus MINISIGN_PASSWORD if the key is protected) to enable signed checksums, and publish the matching public key in docs/."
            exit 0
          fi
          cargo install minisign --locked --quiet
          mkdir -p /tmp/minisign
          printf '%s\n' "$MINISIGN_SECRET_KEY" > /tmp/minisign/release.key
          chmod 600 /tmp/minisign/release.key
          TAG="${TAG_OVERRIDE:-$GITHUB_REF_NAME}"
          RELEASE_JSON=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$TAG")
          ASSET_URL=$(echo "$RELEASE_JSON" | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          for a in d.get('assets',[]):
              if a['name']=='CHECKSUMS.txt':
                  print(a['browser_download_url']); break
          ")
          if [ -z "$ASSET_URL" ]; then
            echo "::notice::No CHECKSUMS.txt asset found to sign; skipping."
            exit 0
          fi
          curl -sL -H "Authorization: token $GITHUB_TOKEN" -o /tmp/minisign/CHECKSUMS.txt "$ASSET_URL"
          export MINISIGN_PASSWORD
          ~/.cargo/bin/minisign -S -s /tmp/minisign/release.key -m /tmp/minisign/CHECKSUMS.txt
          UPLOAD_URL=$(echo "$RELEASE_JSON" | python3 -c "import json,sys; print(json.load(sys.stdin)['upload_url'].split('{')[0])")
          curl -s -X POST -H "Authorization: token $GITHUB_TOKEN" \
            -H "Content-Type: text/plain" \
            --data-binary @/tmp/minisign/CHECKSUMS.txt.minisig \
            "$UPLOAD_URL?name=CHECKSUMS.txt.minisig"
          rm -f /tmp/minisign/release.key
