# ScholarScribe. automated release builds on Windows, macOS (Apple Silicon
# and Intel, two separate .dmg files), and Linux.
#
# When you push a tag matching v* (e.g. v2.2.0-pre), this workflow:
#   1. Spins up Windows, two macOS runners (Apple Silicon + Intel), and
#      Linux runners in parallel.
#   2. Installs Rust, Node, and platform-specific prerequisites.
#   3. Builds platform installers via `tauri build`.
#   4. Uploads all installers to the matching GitHub Release.
#
# To trigger:
#   git tag v2.2.0-pre
#   git push origin v2.2.0-pre

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (must already exist)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows x64. Tauri's default produces both .msi and .exe (NSIS).
          - platform: windows-latest
            args: ""
          # macOS Apple Silicon (macos-latest is M1). Native build, no
          # --target arg needed.
          - platform: macos-latest
            args: ""
          # macOS Intel (macos-13 is the last Intel runner). Native build
          # for x86_64-apple-darwin. Produces a separate .dmg from the
          # Apple Silicon build.
          - platform: macos-13
            args: ""
          # Linux x64. Tauri's default produces both .deb and .AppImage.
          - platform: ubuntu-22.04
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          # Include runner.arch in the key so Intel (X64) and Apple Silicon
          # (ARM64) Mac caches do not collide.
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-cargo-

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev

      - name: Install npm dependencies
        run: npm install --no-audit --no-fund

      - name: Verify frontend type-checks
        run: npm run check

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: "${{ inputs.tag || github.ref_name }} (Pre-release)"
          releaseBody: |
            ScholarScribe ${{ inputs.tag || github.ref_name }}

            ## Install

            1. Install [Ollama](https://ollama.com/download).
            2. Download the installer for your platform below.
            3. Open ScholarScribe, go to the Models tab, download a model.
            4. See [USER_GUIDE.md](USER_GUIDE.md) for the 5-minute walkthrough. A polished PDF copy is attached below as `ScholarScribe-User-Guide.pdf`.

            ## Platforms

            - **Windows**: `.msi` and `.exe` installers (x64).
            - **macOS Apple Silicon**: `.dmg` and `.app.tar.gz` (aarch64).
            - **macOS Intel**: `.dmg` and `.app.tar.gz` (x86_64).
            - **Linux**: `.deb`, `.rpm`, and `.AppImage` (x64).

            ## Privacy

            Zero telemetry. Single outbound host (registry.ollama.ai, only on model download). All inference runs locally via Ollama. See [SECURITY.md](SECURITY.md).

            ## Ethical use

            ScholarScribe does **not** include detection-evasion features. See [docs/ETHICS.md](docs/ETHICS.md).

            ## Verification

            All commits pass `npm run check`, `npm run build`, `cargo fmt --check`, and `cargo check`. Clippy runs in informational mode (`continue-on-error: true`); approximately 21 pre-existing clippy warnings across 9 source files are tracked as a follow-up refactor sprint (see CHANGELOG.md decision 9). A grep for em (U+2014) and en (U+2013) dashes across user-facing files returns zero matches. The `CHECKSUMS.txt` asset contains SHA-256 digests for every binary artifact and the User Guide PDF.
          releaseDraft: false
          prerelease: true
          args: ${{ matrix.args }}

      # Generate the User Guide PDF and upload it to the release. Only runs on
      # the Linux matrix entry to avoid four-way duplicate uploads (the PDF
      # is platform-agnostic). Depends on the release having been created by
      # the tauri-action step above.
      - name: Generate and upload User Guide PDF
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          python3 -m pip install --quiet --user reportlab pypdf
          python3 scripts/user_guide_pdf.py --input USER_GUIDE.md --output ScholarScribe-User-Guide.pdf
          # Upload via the GitHub REST API. The release ID is discovered by
          # looking up the tag.
          TAG="${{ inputs.tag || github.ref_name }}"
          RELEASE_ID=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/${TAG}" \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['id'])")
          # Delete any existing PDF asset first (idempotent re-runs).
          EXISTING=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases/${RELEASE_ID}/assets?name=ScholarScribe-User-Guide.pdf" \
            | python3 -c "import json,sys; data=json.load(sys.stdin); print(data[0]['id'] if data else '')")
          if [ -n "$EXISTING" ]; then
            curl -s -X DELETE -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/releases/assets/${EXISTING}"
          fi
          # Upload the freshly generated PDF.
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/pdf" \
            --data-binary @ScholarScribe-User-Guide.pdf \
            "https://uploads.github.com/repos/${{ github.repository }}/releases/${RELEASE_ID}/assets?name=ScholarScribe-User-Guide.pdf"
          # Also refresh CHECKSUMS.txt to include the PDF.
          python3 - <<'PYEOF'
          import hashlib, json, os, urllib.request, urllib.error, sys
          TOKEN = os.environ['GITHUB_TOKEN']
          REPO = os.environ['GITHUB_REPOSITORY']
          TAG = os.environ.get('TAG_OVERRIDE', '') or os.environ.get('GITHUB_REF_NAME', '')
          if not TAG:
              print('No tag found, skipping CHECKSUMS refresh', file=sys.stderr)
              sys.exit(0)
          def api(method, path, body=None, headers_extra=None):
              url = f"https://api.github.com/repos/{REPO}/{path}"
              data = json.dumps(body).encode() if body else None
              headers = {'Authorization': f'token {TOKEN}', 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'}
              if headers_extra:
                  headers.update(headers_extra)
              req = urllib.request.Request(url, method=method, data=data, headers=headers)
              try:
                  with urllib.request.urlopen(req) as r:
                      return json.loads(r.read()) if r.status != 204 else {}
              except urllib.error.HTTPError as e:
                  print(f'HTTP {e.code}: {e.read().decode()[:300]}', file=sys.stderr)
                  return {}
          release = api('GET', f'releases/tags/{TAG}')
          if not release:
              sys.exit(1)
          upload_url = release['upload_url'].split('{')[0]
          # Delete existing CHECKSUMS.txt
          for a in release.get('assets', []):
              if a['name'] == 'CHECKSUMS.txt':
                  api('DELETE', f'releases/assets/{a["id"]}')
                  break
          # Download all current assets and compute SHA-256
          lines = []
          for a in release.get('assets', []):
              req = urllib.request.Request(a['browser_download_url'], headers={'Authorization': f'token {TOKEN}'})
              with urllib.request.urlopen(req) as r:
                  data = r.read()
              h = hashlib.sha256(data).hexdigest()
              lines.append(f'{h}  {a["name"]}')
          # Upload fresh CHECKSUMS.txt
          body = '\n'.join(lines) + '\n'
          req = urllib.request.Request(upload_url + '?name=CHECKSUMS.txt', data=body.encode(), method='POST',
              headers={'Authorization': f'token {TOKEN}', 'Accept': 'application/vnd.github+json', 'Content-Type': 'text/plain'})
          try:
              with urllib.request.urlopen(req) as r:
                  print(f'CHECKSUMS.txt uploaded: HTTP {r.status}')
          except urllib.error.HTTPError as e:
              print(f'CHECKSUMS upload failed: {e.read().decode()[:300]}', file=sys.stderr)
          PYEOF
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TAG_OVERRIDE: ${{ inputs.tag || github.ref_name }}
