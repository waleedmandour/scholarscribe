# ScholarScribe. Word Assist release workflow — DRAFT (v0.1 work order A5).
#
# OWNER RULING (2026-10-26): the ScholarScribe app and the Word Assist
# add-in are NOT separately versioned. Word Assist previews ship as
# PRE-RELEASES CARRYING THE MAIN APP VERSION, and the Word Assist add-in
# artifacts ride along as release assets. The old separate scheme
# (tag word-assist-v0.1.0, app version overridden to 0.1.0 by
# src-tauri/tauri.wordassist.conf.json) is retired: the overlay is now an
# intentionally empty {} and the build reports the app version.
#
# NOT WIRED TO ANYTHING the owner has not seen: this file is additive, and
# the owner reviews it before the first real tag push. The app's own
# release.yml is untouched except for a skip-guard on the exact tag below;
# its trigger (`v*`) cannot fire from a word-assist tag.
#
# Triggers:
#   - tags word-assist-v*            — legacy plugin-versioned family
#                                      (word-assist-v0.1.0 already shipped)
#   - tag  v2.3.0-pre (EXACT)        — the app-versioned Word Assist
#                                      pre-release. Listed EXPLICITLY (not
#                                     a pattern like v*-pre) so an app-only
#                                      pre-release pushed from main can
#                                      never accidentally route here.
#                                      release.yml skip-guards the same tag.
#   - branches word-assist-rc-*      — pipeline dry runs (artifacts only)
#   - workflow_dispatch, dry_run=true (default) — artifacts only
#
# Builds: Windows x64 + macOS arm64 + macOS x64 (native on macos-15-intel,
# no cross-compile), all with --features word-assist, UNSIGNED (owner
# default: no code signing; SmartScreen/Gatekeeper warnings are expected
# and documented).
#
# Permissions: workflow-level read-only; `contents: write` exists ONLY on
# the publish job, and only when dry_run is false.
#
# Assets: app installers named with the app identity
# (ScholarScribe-<tag>-<os>-<arch>.* for app-versioned tags; legacy
# Word-Assist-* naming kept for word-assist-v* tags), plus the Word Assist
# add-in artifacts (sideloadable manifest + add-in dist zip with the
# install guide), SHA256SUMS and SBOMs (CycloneDX for npm and cargo).

name: Word Assist Release (draft)

on:
  push:
    branches:
      # P5: RC-branch pushes exercise the release pipeline as a DRY RUN
      # (artifacts only). A branch push can NEVER publish: the publish job
      # requires github.ref_type == 'tag' (walk-through in the delivery
      # README). Tag pushes still trigger normally.
      - word-assist-rc-*
    tags:
      - "word-assist-v*"
      # The app-versioned Word Assist pre-release (owner ruling: no app /
      # plugin version mixing). EXACT tag, not a pattern — see header.
      - "v2.3.0-pre"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and upload artifacts only (no release)"
        required: false
        default: true
        type: boolean

# P5: serialize runs per ref. cancel-in-progress is deliberately FALSE
# here: a release run must never be killed halfway (a cancelled tag run
# would leave a half-attached release). Different refs never collide
# because the group includes github.ref.
concurrency:
  group: word-assist-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Intentionally an EMPTY overlay ({}) since 2026-10-26: the Word Assist
  # build keeps the main app version from tauri.conf.json. The previous
  # "version": "0.1.0" override mixed the add-in's version into the app
  # installers. The overlay stays as the pipeline's feature-build hook.
  TAURI_CONFIG_OVERLAY: src-tauri/tauri.wordassist.conf.json

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            arch: x64
          - os: macos-latest
            platform: macos
            arch: arm64
          - os: macos-15-intel
            platform: macos
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable (pinned action)
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          # With a SHA pin the ref no longer carries the toolchain name, so
          # the required `toolchain` input must be given explicitly (same
          # defect class fixed in word-assist-ci.yml). No components: the
          # release build runs no clippy/rustfmt.
          toolchain: stable

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-rel-wa-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-cargo-rel-wa-

      - name: Install npm dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify frontend type-checks and add-in dist integrity
        run: |
          npm run check
          npm test

      - name: Build Tauri app with the word-assist feature (unsigned)
        run: npm run tauri build -- --features word-assist --config ${{ env.TAURI_CONFIG_OVERLAY }}

      - name: Dry-run / publish mode banner
        shell: bash
        run: |
          # P5: the banner reflects the hard gate below — anything that is
          # not a publish-family tag push is a dry run by construction.
          if [ "${{ github.ref_type }}" != "tag" ]; then
            echo "DRY RUN (no tag): artifacts go to this workflow run only; publishing requires a word-assist-v* tag or the listed app-versioned tag (v2.3.0-pre)."
          elif [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "DRY RUN: artifacts go to this workflow run only; no release is created."
          else
            echo "PUBLISH MODE: artifacts will be attached to the pre-release."
          fi

      - name: Stage renamed assets (release identity + OS + architecture)
        shell: bash
        run: |
          mkdir -p staging
          # Asset naming follows the release identity (owner ruling: do not
          # mix the app and the add-in): app-versioned tags ship the
          # installers under the APP name; legacy word-assist-v* tags keep
          # the historical Word-Assist-* names.
          case "$GITHUB_REF_NAME" in
            word-assist-v*) PREFIX="Word-Assist" ;;
            *)              PREFIX="ScholarScribe" ;;
          esac
          # Tauri writes bundles under target/release/bundle. Copy every
          # installer with a deterministic name; keep the original ext.
          find src-tauri/target/release/bundle -type f \( -name "*.msi" -o -name "*.exe" -o -name "*.dmg" -o -name "*.app.tar.gz" \) -print0 |
            while IFS= read -r -d '' f; do
              base=$(basename "$f")
              ext="${base##*.}"
              case "$base" in
                *.app.tar.gz) ext="app.tar.gz" ;;
              esac
              cp "$f" "staging/${PREFIX}-${GITHUB_REF_NAME#refs/tags/}-${{ matrix.platform }}-${{ matrix.arch }}.$ext"
            done
          ls -la staging/

      - name: Generate cargo SBOM
        working-directory: src-tauri
        run: |
          cargo install cargo-cyclonedx --locked --quiet
          # NOTE: cargo cyclonedx (v0.5.x) does not accept --locked
          # ("unexpected argument", verified locally against 0.5.9); it
          # reads the committed Cargo.lock via cargo metadata as-is.
          cargo cyclonedx --format json --features word-assist
          mv ./scholarscribe.cdx.json ../staging/sbom-word-assist-${{ matrix.platform }}-${{ matrix.arch }}.cdx.json

      - uses: actions/upload-artifact@v4
        with:
          name: word-assist-${{ matrix.platform }}-${{ matrix.arch }}
          path: staging/
          if-no-files-found: error

  publish:
    # Publishes ONLY on a publish-family TAG push, never in dry-run, never
    # from a branch push, never from workflow_dispatch (dispatch always runs
    # on a branch ref, so github.ref_type is 'branch' there — see the
    # trigger walk-through in the delivery README). This is the single job
    # holding contents: write. Publish families: legacy word-assist-v* tags
    # and the explicitly listed app-versioned tag(s) (v2.3.0-pre).
    if: github.ref_type == 'tag' && (startsWith(github.ref_name, 'word-assist-v') || github.ref_name == 'v2.3.0-pre') && inputs.dry_run != true
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true

      - name: Stage the Word Assist add-in artifacts (manifest + dist + guide)
        shell: bash
        run: |
          # The add-in artifacts ride along with the app release (owner
          # ruling: one pre-release, app version, plugin artifacts inside).
          # The manifest here carries the {PORT} placeholder — Word needs a
          # port-filled manifest, which the app's Word Assist tab exports
          # ("Export manifest file…"); the template + the full add-in dist
          # are shipped for transparency, offline review, and sideloading
          # without rebuilding.
          TAG="${GITHUB_REF_NAME#refs/tags/}"
          mkdir -p addin-stage/ScholarScribe-Word-Assist
          cp -r word-addin/dist/. addin-stage/ScholarScribe-Word-Assist/
          cp docs/WORD_ASSIST_INSTALL.md addin-stage/ScholarScribe-Word-Assist/
          (cd addin-stage && zip -qr "../addin-dist.zip" ScholarScribe-Word-Assist)
          cp addin-dist.zip "artifacts/ScholarScribe-Word-Assist-addin-${TAG}.zip"
          cp word-addin/dist/manifest.xml "artifacts/ScholarScribe-Word-Assist-manifest-${TAG}.xml"
          ls -la artifacts/

      - name: Generate npm SBOM (platform-independent, once)
        run: |
          npm ci --no-audit --no-fund
          npx --yes @cyclonedx/cyclonedx-npm --omit dev --output-file artifacts/sbom-npm.cdx.json

      - name: Compute SHA256SUMS
        shell: bash
        run: |
          cd artifacts
          find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 |
            xargs -0 sha256sum > SHA256SUMS
          cat SHA256SUMS

      - name: Create the pre-release and upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#refs/tags/}"
          # Release identity follows the tag family (owner ruling: the app
          # and its Word Assist add-in are not version-mixed).
          case "$TAG" in
            word-assist-v*)
              TITLE="Word Assist ${TAG#word-assist-v} (Preview)"
              cat > notes.md <<'EOF'
          PREVIEW: Word Assist v0.1 release candidate assets. Unsigned build; see docs/RELEASE_PLAN_v0.1.md for what is and is not validated per platform. Windows SmartScreen / macOS Gatekeeper will warn because the binaries are unsigned.
          EOF
              ;;
            *)
              TITLE="ScholarScribe ${TAG} (Pre-release · includes Word Assist)"
              cat > notes.md <<'EOF'
          PRE-RELEASE of the ScholarScribe desktop app that INCLUDES the Word Assist preview (an opt-in, local-only grammar assistant for Microsoft Word).

          ## What changed

          - **Fixed**: accepting the Word Assist disclosure now persists your consent. In the previous preview (word-assist-v0.1.0) no code path ever wrote the opt-in flag, so every enable attempt failed with "Word Assist is not opted in. Enable it from the Word Assist tab (the disclosure dialog)." A regression gate (`scripts/check-wa-consent.mjs`) now pins the consent path in CI.
          - **Release identity**: this preview replaces the separately-versioned `word-assist-v0.1.0` scheme. The release carries the **main app version**; the Word Assist add-in artifacts ship as assets of the same release. The app build no longer overrides its version with the add-in's.

          ## Assets

          - `ScholarScribe-<tag>-windows-x64.(msi|exe)`, `ScholarScribe-<tag>-macos-*.dmg` — the desktop app installers (built with the Word Assist feature compiled in; the feature stays opt-in at runtime).
          - `ScholarScribe-Word-Assist-addin-<tag>.zip` — the Word Assist add-in (task pane client, sideloadable manifest template, install guide `WORD_ASSIST_INSTALL.md` inside).
          - `ScholarScribe-Word-Assist-manifest-<tag>.xml` — the add-in manifest template alone ({PORT} placeholder; Word needs the port-filled manifest the app's Word Assist tab exports).
          - `SHA256SUMS` + CycloneDX SBOMs — digests and build inventory.

          ## Using Word Assist

          1. Install and open the app → **Word Assist** tab → read and accept the disclosure → Enable.
          2. Trust the local CA certificate (the tab shows the exact per-OS commands; no administrator rights needed).
          3. In the app, click **Export manifest file…** and sideload it in Word (shared-folder catalog on Windows, `wef` folder on macOS) — full steps: `WORD_ASSIST_INSTALL.md` (also inside the add-in zip).
          4. Generate a pairing code in the app, type it into the Word pane, and type a sentence with a grammar error.

          ## Caveats

          - UNSIGNED build: Windows SmartScreen / macOS Gatekeeper will warn — that is the OS working as intended.
          - Platform validation: Windows QA pending (owner QA matrix `docs/QA_v0.1.md`); macOS builds unvalidated.
          - Grammar checking is provisional (local harper engine, no accuracy claims); spelling/clarity ship disabled; AI rewrites ship disabled.
          - Microsoft 365 Word desktop required for the annotation APIs (not Word 2019/2021 perpetual, not Word for the web).
          EOF
              ;;
          esac
          gh release create "$GITHUB_REF_NAME" \
            --title "$TITLE" \
            --notes-file notes.md \
            --prerelease
          gh release upload "$GITHUB_REF_NAME" artifacts/* --clobber
