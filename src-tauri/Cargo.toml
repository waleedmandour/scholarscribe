[package]
name = "scholarscribe"
version = "2.2.1"
description = "Privacy-first local LLM writing companion for researchers"
authors = ["Waleed Mandour"]
license = "MIT"
edition = "2021"
# harper-core (rule-based grammar engine, v2.3.0) uses Rust edition 2024,
# stabilised in Rust 1.85. Previous floor 1.77 no longer sufficient.
rust-version = "1.85"

[lib]
name = "scholarscribe_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
anyhow = "1"
thiserror = "1"
log = "0.4"
env_logger = "0.11"
uuid = { version = "1", features = ["v4"] }
regex = "1"
once_cell = "1"
sysinfo = "0.32"
url = "2"
zip = { version = "2", default-features = false, features = ["deflate", "time"] }
# zip default features disabled: (a) ScholarScribe only uses Deflate; (b) default `lzma` feature pulls `xz2 -> lzma-sys` (links="lzma"), conflicting with harper-core's transitive `liblzma-sys` (also links="lzma"). Cargo forbids two crates linking the same native lib.

# Writing Provenance (v2.1.0), hash chain + Ed25519 signing + OOXML revisions
sha2 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
quick-xml = "0.31"
# CSPRNG for signing-key generation
getrandom = "0.2"
# OS keychain (Windows Credential Manager / macOS Keychain / Linux Secret Service)
# for the signing key seed and the Google OAuth refresh token.
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }

# Pin time to a version compatible with cookie 0.18.1.
# time 0.3.52 introduced a breaking change to Parsed::parse() (added a
# required `defaults: Option<Parsed>` argument) in a patch release, which
# breaks cookie 0.18.1's call site at parse.rs:226. Pin to 0.3.36 which
# has the original 1-argument signature. Remove this pin once cookie
# publishes a release compatible with time >= 0.3.52.
# (parsing/formatting features: Track Changes w:date timestamps, v2.1.0)
time = { version = "=0.3.36", features = ["parsing", "formatting"] }

# Proofread tab (v2.3.0). harper-core: deterministic offline English grammar engine
# (https://github.com/Automattic/harper, Apache-2.0). Pinned exact; releases every 2-4 weeks.
# `concurrent` feature ON by default (Rc->Arc via Lrc alias in sync.rs); required for Tauri thread pool.
# Tier 1 makes ZERO network calls; verified by `cargo tree -p harper-core` (no reqwest/hyper/ureq/curl/isahc/surf/attohttpc).
harper-core = "=2.11.0"

[features]
custom-protocol = ["tauri/custom-protocol"]
