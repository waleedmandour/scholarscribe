[package]
name = "scholarscribe"
version = "2.3.0"
description = "Privacy-first local LLM writing companion for researchers"
authors = ["Waleed Mandour"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "scholarscribe_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
anyhow = "1"
thiserror = "1"
log = "0.4"
env_logger = "0.11"
uuid = { version = "1", features = ["v4"] }
regex = "1"
once_cell = "1"
sysinfo = "0.32"
url = "2"
# Only deflate is needed: ScholarScribe reads and writes OOXML (.docx) zips,
# which are Stored or Deflated (Word never writes other methods). Default
# features are off so the app does not link lzma (links = "lzma" is exclusive
# and would conflict with harper-core's own zip dependency).
zip = { version = "2", default-features = false, features = ["deflate"] }

# Writing Provenance (v2.1.0), hash chain + Ed25519 signing + OOXML revisions
sha2 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
quick-xml = "0.31"
# Language Check (v2.2.1 r5): offline, privacy-first grammar, spelling and
# style lints. Pinned to an exact version on purpose: upgrades are deliberate
# events reviewed against the upstream changelog (see the feature plan).
harper-core = "=2.11.0"
# CSPRNG for signing-key generation
getrandom = "0.2"
# OS keychain (Windows Credential Manager / macOS Keychain / Linux Secret Service)
# for the signing key seed and the Google OAuth refresh token.
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }

# Word Assist (feature/word-assist) listener stack. hyper/hyper-util/
# http-body-util/tokio-rustls/rustls/rustls-pki-types are ALREADY in
# Cargo.lock as reqwest's transitive deps at these exact versions
# (verified in recon §7); declaring them directly adds no crate. rcgen is
# the one genuinely new dependency (owner ruling D-2, MIT OR Apache-2.0,
# pure Rust). All optional: the default build pulls none of them.
hyper = { version = "1", optional = true, default-features = false, features = ["http1", "server"] }
hyper-util = { version = "0.1", optional = true, default-features = false, features = ["http1", "tokio"] }
http-body-util = { version = "0.1", optional = true }
tokio-rustls = { version = "0.26", optional = true, default-features = false, features = ["ring"] }
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring", "logging", "std", "tls12"] }
rustls-pki-types = { version = "1", optional = true }
rcgen = { version = "0.14", optional = true }
# H5: x509 assertions on the generated CA/leaf (parse the certs and
# assert CA flag, pathlen, name constraints, EKU, SANs, validity).
# Already in Cargo.lock as rcgen's own optional dep at this exact
# version — declared directly only for the feature build; the default
# build still resolves neither crate (CI: word-assist-gates "default
# build excludes rcgen/x509-parser" step).
x509-parser = { version = "=0.18.1", optional = true }
# NOTE (owner ruling E-4, 2026-10-23): the ledger is a plain SHA-256 hash
# chain with the chain head signed at export via the provenance signing
# path. hmac was briefly introduced for the ledger chain and REMOVED —
# see docs/LEDGER_THREAT_MODEL.md for why a locally stored MAC key adds
# nothing over the chain + export signature.

# Pin time to a version compatible with cookie 0.18.1.
# time 0.3.52 introduced a breaking change to Parsed::parse() (added a
# required `defaults: Option<Parsed>` argument) in a patch release, which
# breaks cookie 0.18.1's call site at parse.rs:226. Pin to 0.3.36 which
# has the original 1-argument signature. Remove this pin once cookie
# publishes a release compatible with time >= 0.3.52.
# (parsing/formatting features: Track Changes w:date timestamps, v2.1.0)
time = { version = "=0.3.36", features = ["parsing", "formatting"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
# Word Assist (feature/word-assist): as-you-type assist for Microsoft Word.
# Off by default; every artifact of the feature is gated on this flag so the
# default build stays byte-for-byte the pre-feature build. New crates
# introduced by the feature: rcgen only (D-2); the rest is the in-tree
# hyper/rustls stack (recon §7 option A).
word-assist = [
  "dep:hyper",
  "dep:hyper-util",
  "dep:http-body-util",
  "dep:tokio-rustls",
  "dep:rustls",
  "dep:rustls-pki-types",
  "dep:rcgen",
  "dep:x509-parser",
]
